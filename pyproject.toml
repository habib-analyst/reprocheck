[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reprocheck"
version = "0.1.0"
description = "arXiv-paper → reproducibility-checklist tool"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Habib Ur Rehman" }]
keywords = ["arxiv", "reproducibility", "peer-review", "nlp"]
dependencies = ["requests>=2.28"]

[project.scripts]
reprocheck = "reprocheck.cli:main"

[tool.setuptools.packages.find]
include = ["reprocheck*"]

[tool.setuptools.package-data]
reprocheck = ["fixtures/*.txt"]
